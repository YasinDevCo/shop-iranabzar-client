<div class="product-card" [class.product-card-orange]="cardVariant === 'orange'">
  <!-- بخش تصویر -->
  <div class="product-card__image" (click)="goToDetail(product._id)">
    <img [src]="getImageUrl()" [alt]="product.title" loading="lazy">

    <!-- نشان موجودی -->
    <span class="product-card__stock" [class]="getStockStatusClass()">
      {{ getStockStatusText() }}
    </span>
  </div>

  <!-- بخش محتوا -->
  <div class="product-card__content">
    <h3 class="product-card__title" (click)="goToDetail(product._id)">
      {{ getShortTitle() }}
    </h3>

<!--    <p class="product-card__description">-->
<!--      {{ getShortDescription() }}-->
<!--    </p>-->

    <div class="product-card__divider"></div>

    <!-- قیمت -->
    <div class="product-card__price">
      <span class="product-card__price-label">قیمت:</span>
      <span class="product-card__price-value">{{ product.price | number }} تومان</span>
    </div>

    <!-- دکمه -->
    <button class="product-card__btn"
            (click)="addToCartClick()"
            [disabled]="!isInStock()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span>{{ isInStock() ? 'افزودن به سبد خرید' : 'ناموجود' }}</span>
    </button>
  </div>
</div>
