<div class="profile-page">
  <div class="profile-header">
    <h3 class="panel-title">اطلاعات کاربری</h3>
  </div>

  <div class="profile-content">
    <form class="profile-form" #registerForm="ngForm" (submit)="updateProfile()">
      <div class="form-container">
        <!-- نام و نام خانوادگی در یک ردیف -->
        <div class="form-row">
          <div class="input-group">
            <label>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              نام
            </label>
            <input
              type="text"
              name="name"
              [(ngModel)]="profileRequestModel.name"
              #name="ngModel"
              placeholder="نام خود را وارد کنید"
              required
              [class.is-invalid]="name.invalid && name.touched"
            >
            <div class="error-message" *ngIf="name.invalid && name.touched">
              لطفاً نام خود را وارد کنید
            </div>
          </div>

          <div class="input-group">
            <label>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              نام خانوادگی
            </label>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="profileRequestModel.lastName"
              #lastName="ngModel"
              placeholder="نام خانوادگی خود را وارد کنید"
              required
              [class.is-invalid]="lastName.invalid && lastName.touched"
            >
            <div class="error-message" *ngIf="lastName.invalid && lastName.touched">
              لطفاً نام خانوادگی خود را وارد کنید
            </div>
          </div>
        </div>

        <!-- موبایل و ایمیل در یک ردیف -->
        <div class="form-row">
          <div class="input-group">
            <label>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12" y2="18"/>
              </svg>
              شماره موبایل
            </label>
            <input
              type="tel"
              name="mobile"
              [(ngModel)]="profileRequestModel.mobile"
              #mobile="ngModel"
              placeholder="شماره موبایل خود را وارد کنید"
              required
              pattern="09[0-9]{9}"
              [class.is-invalid]="mobile.invalid && mobile.touched"
            >
            <div class="error-message" *ngIf="mobile.invalid && mobile.touched">
              شماره موبایل باید با 09 شروع و 11 رقم باشد
            </div>
          </div>

          <div class="input-group">
            <label>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              ایمیل
            </label>
            <input
              type="email"
              name="email"
              [(ngModel)]="profileRequestModel.email"
              #email="ngModel"
              placeholder="ایمیل خود را وارد کنید"
              required
              email
              [class.is-invalid]="email.invalid && email.touched"
            >
            <div class="error-message" *ngIf="email.invalid && email.touched">
              لطفاً یک ایمیل معتبر وارد کنید
            </div>
          </div>
        </div>

        <!-- رمز عبور -->
        <div class="input-group full-width">
          <label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            رمز عبور جدید <span class="optional">(اختیاری)</span>
          </label>
          <input
            type="password"
            name="password"
            [(ngModel)]="profileRequestModel.password"
            #password="ngModel"
            placeholder="برای تغییر رمز عبور وارد کنید"
            minlength="6"
            [class.is-invalid]="password.invalid && password.touched"
          >
          <div class="error-message" *ngIf="password.invalid && password.touched">
            رمز عبور باید حداقل 6 کاراکتر باشد
          </div>
          <div class="hint-text">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12" y2="16"/>
            </svg>
            در صورت تمایل به تغییر رمز عبور، مقدار جدید را وارد کنید
          </div>
        </div>
      </div>

      <!-- دکمه اصلی -->
      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="loading || registerForm.invalid">
          <span *ngIf="!loading">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            ذخیره تغییرات
          </span>
          <span *ngIf="loading" class="spinner-container">
            <span class="spinner"></span> در حال ذخیره...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
