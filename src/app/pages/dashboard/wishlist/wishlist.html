<div class="wishlist-container">
  <div class="page-header">
    <h3 class="panel-title">علاقه‌مندی‌های من</h3>
    <button class="btn-clear-all" (click)="clearAllWishlist()" *ngIf="wishlistItems.length > 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      حذف همه
    </button>
  </div>

  <div class="loading-overlay" *ngIf="loading">
    <div class="spinner"></div>
  </div>

  <div class="wishlist-grid" *ngIf="!loading">
    <div class="wishlist-card" *ngFor="let item of wishlistItems; trackBy: trackById">
      <div class="product-image">
        <img [src]="item.productId?.images?.[0] || 'assets/images/default-product.jpg'" [alt]="item.productId?.title">
        <button class="btn-remove" (click)="removeFromWishlist(item.productId?._id, item.productId?.title)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="product-info">
        <h4 class="product-title">{{ item.productId?.title }}</h4>
        <div class="product-price">{{ item.productId?.price | number }} تومان</div>
        <button class="btn-add-to-cart" (click)="addToCart(item.productId)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          افزودن به سبد خرید
        </button>
      </div>
    </div>

    <div class="empty-wishlist" *ngIf="wishlistItems.length === 0">
      <div class="empty-icon">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <h3>علاقه‌مندی‌های شما خالی است</h3>
      <p>محصولاتی که دوست دارید را به این لیست اضافه کنید</p>
      <button class="btn-shop" routerLink="/products">مشاهده محصولات</button>
    </div>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button class="page-btn" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      قبلی
    </button>
    <span class="page-info">صفحه {{ currentPage }} از {{ totalPages }} ({{ totalItems }} محصول)</span>
    <button class="page-btn" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
      بعدی
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>
</div>
