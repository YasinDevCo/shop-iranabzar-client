<div class="products-page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">محصولات</h1>
      <p class="page-description">جدیدترین و بهترین محصولات را با بهترین قیمت تهیه کنید</p>
    </div>

    <!-- لایه‌بندی محصولات -->
    <div class="products-layout">
      <!-- سایدبار فیلتر (برای دسکتاپ) -->
      <aside class="filters-sidebar">
        <div class="filters-header">
          <h3>فیلترها</h3>
        </div>

        <!-- فیلتر دسته‌بندی -->
        <div class="filter-group">
          <div class="filter-title" (click)="toggleFilterGroup('category')">
            <div class="title-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 7h-4.18A3 3 0 0 0 16 5.18V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1.18A3 3 0 0 0 8.18 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                <line x1="12" y1="13" x2="12" y2="20"/>
                <line x1="8" y1="17" x2="16" y2="17"/>
              </svg>
            </div>
            <span>دسته‌بندی</span>
            <svg class="arrow" [class.rotated]="openGroups['category']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="filter-content" [class.show]="openGroups['category']">
            <div class="filter-option" *ngFor="let cat of categories">
              <label class="checkbox-label">
                <input type="checkbox" [value]="cat._id"
                       [checked]="isSelectedCategory(cat._id)"
                       (change)="onCategoryFilterChange($event)">
                <span class="checkmark"></span>
                <span class="option-text">{{ cat.name }}</span>
                <span class="option-count" *ngIf="cat.productCount">({{ cat.productCount }})</span>
              </label>
            </div>
          </div>
        </div>

        <!-- فیلتر قیمت -->
        <div class="filter-group">
          <div class="filter-title" (click)="toggleFilterGroup('price')">
            <div class="title-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 2v20M2 12h20"/>
              </svg>
            </div>
            <span>محدوده قیمت</span>
            <svg class="arrow" [class.rotated]="openGroups['price']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="filter-content" [class.show]="openGroups['price']">
            <div class="price-range">
              <div class="price-input">
                <label>از</label>
                <input type="number" placeholder="۰" [(ngModel)]="minPrice" (ngModelChange)="onPriceChange()">
              </div>
              <div class="price-input">
                <label>تا</label>
                <input type="number" placeholder="هر مقدار" [(ngModel)]="maxPrice" (ngModelChange)="onPriceChange()">
              </div>
            </div>
          </div>
        </div>

        <!-- فیلتر موجودی -->
        <div class="filter-group">
          <div class="filter-title" (click)="toggleFilterGroup('stock')">
            <div class="title-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
            </div>
            <span>وضعیت موجودی</span>
            <svg class="arrow" [class.rotated]="openGroups['stock']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="filter-content" [class.show]="openGroups['stock']">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="inStockOnly" (change)="onStockFilterChange()">
              <span class="checkmark"></span>
              <span class="option-text">فقط محصولات موجود</span>
            </label>
          </div>
        </div>

        <button class="btn-clear-filters" (click)="clearAllFilters()" *ngIf="hasActiveFilters()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          پاک کردن همه فیلترها
        </button>
      </aside>

      <!-- بخش محصولات -->
      <div class="products-content">
        <!-- هدر محصولات -->
        <div class="products-header">
          <div class="results-count flex items-center gap-2 ">
            <span class="count-number">   {{ totalProducts }} </span>

            <span class="count-text">محصول</span>
          </div>

          <div class="header-actions">
            <button class="filter-btn-mobile" (click)="openFilterModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/>
              </svg>
              <span>فیلتر</span>
              <span class="filter-badge" *ngIf="hasActiveFilters()">{{ getActiveFiltersCount() }}</span>
            </button>

            <div class="sort-wrapper">
              <select class="sort-select" [(ngModel)]="sortBy" (change)="onSortChange()">
                <option value="newest">جدیدترین</option>
                <option value="price_asc">ارزان‌ترین</option>
                <option value="price_desc">گران‌ترین</option>
                <option value="popular">محبوب‌ترین</option>
              </select>
            </div>

            <div class="search-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" placeholder="جستجوی محصول..." [(ngModel)]="searchQuery" (keyup.enter)="onSearch()">
            </div>
          </div>
        </div>

        <!-- فیلترهای فعال -->
        <div class="active-filters" *ngIf="hasActiveFilters()">
          <span class="active-filter" *ngFor="let filter of getActiveFiltersList()">
            {{ filter.label }}
            <button (click)="removeFilter(filter.type, filter.value)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </span>
          <button class="clear-all-filters" (click)="clearAllFilters()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            پاک کردن همه
          </button>
        </div>

        <!-- لودینگ -->
        <div class="loading-overlay" *ngIf="loading">
          <div class="spinner"></div>
        </div>

        <!-- لیست محصولات -->
        <div class="products-grid" *ngIf="!loading">
          <app-product-card
            *ngFor="let product of products"
            [product]="product"
            cardVariant="default"
            (addToCart)="addToCart($event)">
          </app-product-card>
        </div>

        <!-- پیغام خالی -->
        <div class="empty-products" *ngIf="products.length === 0 && !loading">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <h3>محصولی یافت نشد</h3>
          <p>با فیلترهای مختلف جستجو کنید یا عبارت دیگری را امتحان کنید</p>
          <button class="btn-clear-filters" (click)="clearAllFilters()">پاک کردن همه فیلترها</button>
        </div>


        <app-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalItems]="totalProducts"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </div>
</div>

<!-- مودال فیلتر (برای موبایل) -->
<div class="filter-modal" [class.open]="isFilterOpen">
  <div class="filter-modal-overlay" (click)="closeFilterModal()"></div>
  <div class="filter-modal-content">
    <div class="filter-modal-header">
      <h3>فیلترها</h3>
      <button class="close-modal" (click)="closeFilterModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="filter-modal-body">
      <!-- فیلتر دسته‌بندی -->
      <div class="filter-group">
        <div class="filter-title" (click)="toggleFilterGroup('category')">
          <div class="title-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 7h-4.18A3 3 0 0 0 16 5.18V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v1.18A3 3 0 0 0 8.18 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
              <line x1="12" y1="13" x2="12" y2="20"/>
              <line x1="8" y1="17" x2="16" y2="17"/>
            </svg>
          </div>
          <span>دسته‌بندی</span>
          <svg class="arrow" [class.rotated]="openGroups['category']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-content" [class.show]="openGroups['category']">
          <div class="filter-option" *ngFor="let cat of categories">
            <label class="checkbox-label">
              <input type="checkbox" [value]="cat._id"
                     [checked]="isSelectedCategory(cat._id)"
                     (change)="onCategoryFilterChange($event)">
              <span class="checkmark"></span>
              <span class="option-text">{{ cat.name }}</span>
            </label>
          </div>
        </div>
      </div>

      <!-- فیلتر قیمت -->
      <div class="filter-group">
        <div class="filter-title" (click)="toggleFilterGroup('price')">
          <div class="title-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 2v20M2 12h20"/>
            </svg>
          </div>
          <span>محدوده قیمت</span>
          <svg class="arrow" [class.rotated]="openGroups['price']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-content" [class.show]="openGroups['price']">
          <div class="price-range">
            <div class="price-input">
              <label>از</label>
              <input type="number" placeholder="۰" [(ngModel)]="minPrice" (ngModelChange)="onPriceChange()">
            </div>
            <div class="price-input">
              <label>تا</label>
              <input type="number" placeholder="هر مقدار" [(ngModel)]="maxPrice" (ngModelChange)="onPriceChange()">
            </div>
          </div>
        </div>
      </div>

      <!-- فیلتر موجودی -->
      <div class="filter-group">
        <div class="filter-title" (click)="toggleFilterGroup('stock')">
          <div class="title-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </div>
          <span>وضعیت موجودی</span>
          <svg class="arrow" [class.rotated]="openGroups['stock']" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="filter-content" [class.show]="openGroups['stock']">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="inStockOnly" (change)="onStockFilterChange()">
            <span class="checkmark"></span>
            <span class="option-text">فقط محصولات موجود</span>
          </label>
        </div>
      </div>
    </div>

    <div class="filter-modal-footer">
      <button class="btn-clear" (click)="clearAllFilters()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        پاک کردن همه
      </button>
      <button class="btn-apply" (click)="closeFilterModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        اعمال فیلترها
      </button>
    </div>
  </div>
</div>
