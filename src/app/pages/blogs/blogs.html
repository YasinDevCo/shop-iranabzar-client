<div class="blogs-container">
  <div class="page-header">
    <h1 class="page-title">آرشیو بلاگ</h1>
    <p class="page-description">جدیدترین مقالات و مطالب آموزشی</p>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" placeholder="جستجوی مقاله..." [(ngModel)]="searchQuery" (keyup.enter)="onSearch()">
    <button class="search-btn" (click)="onSearch()">جستجو</button>
  </div>

  <div class="loading-overlay" *ngIf="loading">
    <div class="spinner"></div>
  </div>

  <div class="blogs-grid" *ngIf="!loading">
    <div class="blog-card" *ngFor="let blog of blogs; trackBy: trackById">
      <div class="blog-image">
        <img [src]="blog.image || 'assets/images/default-blog.jpg'" [alt]="blog.title">
      </div>
      <div class="blog-content">
        <div class="blog-meta">
          <span class="blog-date">{{ blog.createdAt | date:'yyyy/MM/dd' }}</span>
          <span class="blog-author">✍️ {{ blog.author }}</span>
        </div>
        <h3 class="blog-title">{{ blog.title }}</h3>
        <p class="blog-summary">{{ blog.summary }}</p>
        <a [routerLink]="['/blog', blog.slug]" class="btn-read-more">ادامه مطلب ←</a>
      </div>
    </div>

    <div class="empty-blogs" *ngIf="blogs.length === 0">
      <p>هیچ مقاله‌ای یافت نشد</p>
    </div>
  </div>


  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [totalItems]="totalBlogs"
    (pageChange)="changePage($event)">
  </app-pagination>
</div>
