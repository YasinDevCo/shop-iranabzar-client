<section class="auth-container">
  <div class="logo">
    <h1>IRANABZAR</h1>
  </div>

  <div class="form-title">
    ورود به حساب کاربری
  </div>

  <form (ngSubmit)="handleLogin()">
    <app-input-field
      type="email"
      name="email"
      placeholder="ایمیل"
      [(ngModel)]="model.email"
      [required]="true"
      [email]="true"
      [submitted]="submitted"
    ></app-input-field>

    <app-input-field
      type="password"
      name="password"
      placeholder="رمز عبور"
      [(ngModel)]="model.password"
      [required]="true"
      [minlength]="6"
      [submitted]="submitted"
    ></app-input-field>

    <div class="terms-text">
      با کلیک روی "ورود"،
      <a href="#">شرایط و قوانین</a> و
      <a href="#">حریم خصوصی</a> ما را می‌پذیرید.
    </div>

    <button type="submit" class="btn-submit" [disabled]="loading">
      <span *ngIf="!loading">ورود</span>
      <span *ngIf="loading" class="spinner"></span>
    </button>

    <div class="toggle-mode">
      <button type="button" class="toggle-btn" (click)="goToRegister()">
        حساب کاربری ندارید؟ ثبت‌نام کنید
      </button>
    </div>
  </form>
</section>
