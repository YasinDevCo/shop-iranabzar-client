<div class="blog-details-container" *ngIf="!loading">
  <div class="blog-header" *ngIf="blog">
    <div class="blog-header-content">
      <div class="blog-meta">
        <span class="blog-date">{{ blog.createdAt | date:'yyyy/MM/dd' }}</span>
        <span class="blog-author">✍️ {{ blog.author }}</span>
        <span class="blog-views">👁️ {{ blog.views }} بازدید</span>
      </div>
      <h1 class="blog-title">{{ blog.title }}</h1>
    </div>
    <img [src]="blog.image || 'assets/images/default-blog.jpg'" [alt]="blog.title" class="blog-cover">
  </div>

  <div class="blog-content" *ngIf="blog">
    <div class="blog-tags" *ngIf="blog.tags?.length">
      <span class="tag-label">برچسب‌ها:</span>
      <span class="tag" *ngFor="let tag of blog.tags">{{ tag }}</span>
    </div>
    <div class="blog-body" [innerHTML]="blog.content"></div>
    <div class="blog-footer">
      <div class="blog-share">
        <span>اشتراک گذاری:</span>
        <button class="share-btn">📘</button>
        <button class="share-btn">🐦</button>
        <button class="share-btn">📱</button>
      </div>
      <a routerLink="/blogs" class="btn-back flex items-center gap-1">
