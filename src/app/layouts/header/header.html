<!-- ========== هدر اصلی (موبایل و دسکتاپ) ========== -->
<div class="container">
  <header class="flex justify-between items-center">
    <!-- لوگو -->
    <h1>IRANABZAR</h1>

    <!-- سرچ باکس (فقط دسکتاپ) -->
    <div class="search-wrapper">
      <input
        type="text"
        class="search-field"
        placeholder="محصول مورد نظر را جستجو کنید"
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      >
      <button class="search-button" (click)="onSearch()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11.4785 21.9565C15.6062 21.9565 18.1249 21.2974 19.6533 19.8237C21.1731 18.3582 21.9561 15.8484 21.9561 11.478C21.956 7.10781 21.1731 4.59879 19.6533 3.13328C18.1249 1.65947 15.6064 1.00049 11.4785 1.00047C7.35046 1.00047 4.83116 1.65944 3.30273 3.13328C1.78311 4.59882 1.00003 7.10804 1 11.478C1 15.8483 1.78293 18.3582 3.30273 19.8237C4.83116 21.2975 7.35046 21.9565 11.4785 21.9565Z"
            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22.9565 22.9565L20.3478 20.3478" stroke="white" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- آیکون‌های سمت راست -->
    <div class="flex gap-2 items-center">
      <!-- حالت مهمان (لاگین نکرده) -->

 <!-- دکمه ورود/ثبت نام -->

      <!-- دکمه همبرگر منو (فقط موبایل) -->
      <button class="hamburger-btn" (click)="toggleDrawer()" [attr.aria-label]="'منو'">

          <path d="M4 8H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 14H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 20H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
</div>
